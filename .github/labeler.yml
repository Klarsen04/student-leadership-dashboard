# Area labels applied by .github/workflows/labeler.yml (actions/labeler v5).

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".eslintrc.json"
          - ".prettierrc.json"
          - ".prettierignore"

"area: api":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"

"area: db":
  - changed-files:
      - any-glob-to-any-file:
          - "prisma/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
