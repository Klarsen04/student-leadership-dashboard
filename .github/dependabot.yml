version: 2

# Policy: Dependabot auto-handles MINOR/PATCH updates only (grouped, safe).
# MAJOR updates are ignored here and done deliberately when ready to migrate.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @libsql/client is 0.x, so 0.9+ is a "minor" the major-ignore misses,
      # but it can break the @prisma/adapter-libsql peer range.
      - dependency-name: "@libsql/client"
        versions: [">=0.9.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
