<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Student Leadership</title>
    <style>
      :root {
        --cream: #fffaf5;
        --marigold: #ffb400;
        --ink: #2b2b2b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .seed {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--marigold);
        box-shadow: 0 8px 24px rgba(255, 180, 0, 0.35);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.88); opacity: 0.7; }
      }
      h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
      p { margin: 0; opacity: 0.65; max-width: 22rem; line-height: 1.5; }
      @media (prefers-reduced-motion: reduce) {
        .seed { animation: none; }
      }
    </style>
  </head>
  <body>
    <!--
      This is the Capacitor fallback bundle. In normal use the app loads the
      live site (server.url in capacitor.config.ts) and this page is never
      shown. It only appears if the device is offline before the WebView
      reaches the server.
    -->
    <div class="wrap">
      <div class="seed"></div>
      <h1>Student Leadership</h1>
      <p>Getting things ready… If this screen stays, check your internet connection.</p>
    </div>
  </body>
</html>
